services:
  rescue-db:
    image: postgres:16
    environment:
      POSTGRES_DB: center_rescue
      POSTGRES_USER: center_demo
      POSTGRES_PASSWORD: center_demo_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rescue-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U center_demo -d center_rescue"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  rescue-data:
